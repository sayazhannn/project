<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Chance Eau Tendre — карточка WB</title>
<link rel="stylesheet" href="../wb-base.css">
<style>
.card{--ink:#2C1438;--ink-soft:#6E5578;--accent:#B03FC9;--accent-shadow:rgba(176,63,201,.4);
  --sticker:linear-gradient(145deg,#E3BF77,#A7782F);
  --bar:linear-gradient(135deg,#3B1A4A,#22102C);--bar-ink:#fff;
  --cast:drop-shadow(26px 24px 24px rgba(60,30,60,.32)) drop-shadow(0 8px 10px rgba(50,20,50,.22));--contact:.5}
.bg{width:1080px;left:-150px;top:-170px;transform:scaleX(-1);filter:saturate(1.08) brightness(1.04)}
.veil.top{top:0;height:340px;background:linear-gradient(rgba(255,248,252,.92),rgba(255,248,252,.6) 55%,rgba(255,248,252,0))}
.veil.bot{bottom:0;height:300px;background:linear-gradient(rgba(70,30,80,0),rgba(70,30,80,.3))}
h1{font-size:76px}
.product{left:236px;top:478px;width:650px}
.refl{position:absolute;left:236px;top:990px;width:650px;z-index:3;opacity:.2;transform:scaleY(-1);
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 22%);mask-image:linear-gradient(to top,#000 0%,transparent 22%)}
.refl img{width:100%;display:block}
</style></head>
<body>
<div class="card">
  <img class="bg" src="bg.jpg" alt="">
  <div class="veil top"></div><div class="veil bot"></div>

  <div class="head">
    <h1>Chance<br><span class="a">Eau Tendre</span></h1>
    <div class="tag">парфюмерная вода</div>
  </div>

  <div class="ambient" style="left:230px;top:950px;width:680px;height:100px"></div>
  <div class="contact" style="left:250px;top:972px;width:640px;height:36px"></div>
  <div class="refl"><img src="perfume.png" alt=""></div>
  <div class="product"><img src="perfume.png" alt="Chance Eau Tendre"></div>

  <div class="sticker" style="right:44px;top:330px;width:140px;height:140px"><b style="font-size:40px">50</b><span>мл</span></div>

  <div class="pill" style="left:30px;top:420px"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg></div><div>Грейпфрут, айва<small>верхние ноты</small></div></div>
  <div class="pill" style="left:30px;top:520px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21c-4-3-7-6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4-3 7-7 10z"/></svg></div><div>Жасмин, роза<small>ноты сердца</small></div></div>
  <div class="pill" style="left:30px;top:620px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 10.5a6 6 0 0 1-12 0C6 10 9 7 12 3z"/></svg></div><div>Белый мускус<small>базовые ноты</small></div></div>

  <div class="bar">
    <div><b>до 8 ч</b><span>стойкость</span></div>
    <div><b>Цветочный</b><span>фруктовый шлейф</span></div>
    <div><b>EDP</b><span>парфюмерная вода</span></div>
  </div>
</div>
</body></html>
