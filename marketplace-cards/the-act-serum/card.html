<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сыворотка the act — карточка WB</title>
<link rel="stylesheet" href="../wb-base.css">
<style>
.card{--ink:#2E1D16;--ink-soft:#7A6052;--accent:#B5643A;--accent-shadow:rgba(181,100,58,.4);
  --sticker:linear-gradient(145deg,#D08A5C,#94512A);
  --bar:linear-gradient(135deg,#3A251B,#24150F);--bar-ink:#fff;
  --cast:drop-shadow(-30px 30px 30px rgba(80,40,20,.35)) drop-shadow(0 10px 12px rgba(60,30,15,.22))}
.bg{width:1000px;left:-60px;top:-120px;filter:saturate(1.02) brightness(1.04)}
.veil.top{top:0;height:360px;background:linear-gradient(rgba(255,246,240,.93),rgba(255,246,240,.65) 55%,rgba(255,246,240,0))}
.veil.left{top:0;bottom:0;left:0;right:auto;width:420px;background:linear-gradient(90deg,rgba(255,244,236,.35),rgba(255,244,236,0))}
h1{font-size:68px}
.product{left:570px;top:244px;width:300px}
</style></head>
<body>
<div class="card">
  <img class="bg" src="bg.jpg" alt="">
  <div class="veil top"></div><div class="veil left"></div>

  <div class="head">
    <h1>Сыворотка<br><span class="a">для ресниц</span></h1>
    <div class="tag">и бровей · the act</div>
  </div>

  <div class="product"><img src="serum.png" alt="Сыворотка the act"></div>

  <div class="sticker" style="left:400px;top:330px;width:136px;height:136px"><b style="font-size:42px">3</b><span>мл</span></div>

  <div class="pill" style="left:30px;top:500px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div><div>+40% длины<small>ресницы гуще и длиннее</small></div></div>
  <div class="pill" style="left:30px;top:600px"><div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div><div>Эффект за 4 недели<small>видимый результат</small></div></div>
  <div class="pill" style="left:30px;top:700px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20l9-9"/><path d="M13 11l3-7 4 4-7 3"/></svg></div><div>Тонкая кисть<small>точное нанесение</small></div></div>
  <div class="pill" style="left:30px;top:800px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg></div><div>Без жжения<small>для чувствительных глаз</small></div></div>

  <div class="bar">
    <div><b>1 раз</b><span>в день, перед сном</span></div>
    <div><b>2 месяца</b><span>курс одного флакона</span></div>
    <div><b>2 в 1</b><span>ресницы и брови</span></div>
  </div>
</div>
</body></html>
