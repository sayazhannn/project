<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>VOIS набор для волос — карточка WB</title>
<link rel="stylesheet" href="../wb-base.css">
<style>
.card{--ink:#2B0D24;--ink-soft:#7A4E6A;--accent:#E0189A;--accent-shadow:rgba(224,24,154,.4);
  --sticker:linear-gradient(145deg,#F43FB2,#B30C78);
  --bar:linear-gradient(135deg,#3C0F31,#21071B);--bar-ink:#fff;
  --cast:drop-shadow(-30px 26px 26px rgba(90,20,60,.32)) drop-shadow(0 8px 10px rgba(70,10,45,.22));--contact:.55}
.bg{width:1040px;left:-70px;top:-180px;filter:blur(4px) saturate(1.05) brightness(1.04)}
.veil.top{top:0;height:340px;background:linear-gradient(rgba(255,244,248,.93),rgba(255,244,248,.6) 55%,rgba(255,244,248,0))}
.counter{position:absolute;left:0;right:0;top:930px;bottom:0;z-index:2;
  background:linear-gradient(#FBF6F6 0%,#EFE3E4 40%,#E3D2D4 100%);
  box-shadow:0 -1px 0 rgba(255,255,255,.9),0 -14px 40px rgba(80,20,40,.18)}
.counter::before{content:"";position:absolute;inset:0;opacity:.35;
  background:linear-gradient(115deg,transparent 30%,rgba(190,170,175,.35) 34%,transparent 38%),linear-gradient(160deg,transparent 60%,rgba(190,170,175,.3) 63%,transparent 67%)}
h1{font-size:62px}
.product{left:328px;top:248px;width:548px}
</style></head>
<body>
<div class="card">
  <img class="bg" src="bg.jpg" alt="">
  <div class="veil top"></div>
  <div class="counter"></div>

  <div class="head">
    <h1>Восстановление<br><span class="a">и блеск волос</span></h1>
    <div class="tag">шампунь + кондиционер</div>
  </div>

  <div class="ambient" style="left:320px;top:930px;width:580px;height:100px"></div>
  <div class="contact" style="left:350px;top:968px;width:250px;height:34px"></div>
  <div class="contact" style="left:610px;top:968px;width:250px;height:34px"></div>
  <div class="product"><img src="bottles.png" alt="VOIS шампунь и кондиционер"></div>

  <div class="sticker" style="left:200px;top:262px;width:140px;height:140px"><b style="font-size:26px">2×500</b><span>мл</span></div>

  <div class="pill" style="left:28px;top:450px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 13c0-3-2-5-5-5 0 3 2 5 5 5z"/></svg></div><div>Протеин овса<small>питает и укрепляет</small></div></div>
  <div class="pill" style="left:28px;top:550px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6L20 9.3l-4.3 3.9 1.2 5.8L12 16.1 7.1 19l1.2-5.8L4 9.3l5.6-.7z"/></svg></div><div>Эффект ботокса<small>гладкость как из салона</small></div></div>
  <div class="pill" style="left:28px;top:650px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 10.5a6 6 0 0 1-12 0C6 10 9 7 12 3z"/></svg></div><div>Увлажнение<small>без утяжеления</small></div></div>
  <div class="pill" style="left:28px;top:750px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7c3 0 3 3 6 3s3-3 6-3 3 3 4 3"/><path d="M4 12c3 0 3 3 6 3s3-3 6-3 3 3 4 3"/><path d="M4 17c3 0 3 3 6 3s3-3 6-3"/></svg></div><div>Легко расчёсывать<small>без спутывания</small></div></div>

  <div class="bar">
    <div><b>1000 мл</b><span>ухода в наборе</span></div>
    <div><b>Все типы</b><span>волос</span></div>
    <div><b>Блеск</b><span>с первого мытья</span></div>
  </div>
</div>
</body></html>
