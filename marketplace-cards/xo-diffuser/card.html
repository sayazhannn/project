<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Аромадиффузор XO — карточка WB</title>
<link rel="stylesheet" href="../wb-base.css">
<style>
.card{--ink:#2B1D12;--ink-soft:#7A6250;--accent:#C47A2C;--accent-shadow:rgba(196,122,44,.4);
  --sticker:linear-gradient(145deg,#2E2219,#120C08);
  --bar:linear-gradient(135deg,#3A2716,#20150B);--bar-ink:#fff;
  --cast:drop-shadow(-28px 26px 26px rgba(70,40,15,.38)) drop-shadow(0 8px 10px rgba(60,30,10,.25));--contact:.65}
.bg{height:1320px;left:-600px;top:-80px;filter:saturate(1.05) brightness(1.02)}
.veil.top{top:0;height:330px;background:linear-gradient(rgba(255,247,238,.9),rgba(255,247,238,.55) 55%,rgba(255,247,238,0))}
.veil.bot{bottom:0;height:260px;background:linear-gradient(rgba(70,40,15,0),rgba(70,40,15,.3))}
h1{font-size:64px}
.product{left:170px;top:300px;width:560px}
</style></head>
<body>
<div class="card">
  <img class="bg" src="bg.jpg" alt="">
  <div class="veil top"></div><div class="veil bot"></div>

  <div class="head">
    <h1>Аромат<br><span class="a">уюта дома</span></h1>
    <div class="tag">диффузор The Infinity</div>
  </div>

  <div class="ambient" style="left:160px;top:960px;width:600px;height:100px"></div>
  <div class="contact" style="left:200px;top:990px;width:300px;height:34px"></div>
  <div class="contact" style="left:510px;top:990px;width:200px;height:34px"></div>
  <div class="product"><img src="diffuser.png" alt="Аромадиффузор XO The Infinity"></div>

  <div class="sticker" style="right:40px;top:300px;width:140px;height:140px"><b style="font-size:40px">50</b><span>мл</span></div>

  <div class="pill" style="right:28px;top:520px"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></div><div>до 30 дней<small>аромата</small></div></div>
  <div class="pill" style="left:28px;top:430px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M9 20v-6h6v6"/></svg></div><div>до 20 м²<small>площадь</small></div></div>
  <div class="pill" style="left:28px;top:820px"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1z"/></svg></div><div>В подарочной<small>коробке</small></div></div>

  <div class="bar">
    <div><b>5 палочек</b><span>ротанг</span></div>
    <div><b>Без огня</b><span>безопасно</span></div>
    <div><b>Древесный</b><span>тёплый шлейф</span></div>
  </div>
</div>
</body></html>
